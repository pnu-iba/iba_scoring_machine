<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테트리스 — IBA Scoring Machine</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&family=Playfair+Display:wght@700;900&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/chrome.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/icons.js" defer></script>
  <script src="/assets/app.js" defer blocking="render"></script>
  <script src="/assets/chrome.js" defer blocking="render"></script>
  <script src="/games/tetris.js" defer></script>
  <style>
    .tetris-pieces { display: flex; gap: 16px; align-items: flex-start; }
  </style>
</head>
<body>
<main>
<section class="card">
  <div class="card-head">
    <h2>테트리스</h2>
    <a class="more" href="/minigame.html">미니게임 목록<i data-icon="arrow-right"></i></a>
  </div>
  <div class="game-layout">
    <div class="game-stage">
      <canvas id="board" width="280" height="560" aria-label="테트리스 보드"></canvas>
      <div class="game-overlay" id="overlay" hidden></div>
    </div>
    <div class="game-side">
      <div class="game-stats">
        <div><div class="label">점수</div><div class="value" id="score">0</div></div>
        <div><div class="label">최고 기록</div><div class="value" id="best">0</div></div>
        <div><div class="label">줄</div><div class="value" id="lines">0</div></div>
        <div><div class="label">레벨</div><div class="value" id="level">1</div></div>
      </div>
      <div class="tetris-pieces">
        <div>
          <p class="small">보관</p>
          <div class="game-stage"><canvas id="hold" width="96" height="72"></canvas></div>
        </div>
        <div>
          <p class="small">다음 블록</p>
          <div class="game-stage"><canvas id="next" width="96" height="192"></canvas></div>
        </div>
      </div>
      <dl class="keys">
        <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>이동 (누르고 있으면 계속 이동)</dd>
        <dt><kbd>↑</kbd> <kbd>X</kbd></dt><dd>시계 방향 회전</dd>
        <dt><kbd>Z</kbd></dt><dd>반시계 방향 회전</dd>
        <dt><kbd>↓</kbd></dt><dd>빠르게 내리기</dd>
        <dt><kbd>Space</kbd></dt><dd>바로 떨어뜨리기</dd>
        <dt><kbd>C</kbd> <kbd>Shift</kbd></dt><dd>보관 (블록마다 한 번)</dd>
        <dt><kbd>P</kbd> <kbd>Esc</kbd></dt><dd>일시정지</dd>
      </dl>
    </div>
  </div>
</section>

<section class="card flush">
  <div class="card-head"><h2>팀 순위</h2></div>
  <div class="table-wrap">
    <table id="gameBoard" hidden>
      <thead><tr><th>순위</th><th>팀</th><th class="num">점수</th><th class="num">기록 시각</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="empty" id="gameBoardEmpty">불러오는 중…</p>
  <div class="card-foot">팀별 최고 점수입니다. 로그인한 상태로 게임을 마치면 우리 팀 기록으로 올라갑니다.</div>
</section>
</main>
</body>
</html>
