<!-- 오른쪽 위: 메뉴 버튼과 같은 높이에서 마주 보는 두 줄 -->

<main>

    <p class="tagline">Regression Project Scoring Service</p>

</main>

<!-- 하단 바: 배경 없이 사이트와 같은 바탕. 줄글 한 덩이 + 한 줄 저작권. -->

<script>
// 로그인했으면 Sign in 자리에 내 이름과 로그아웃을 둔다.
(async function () {
  const res = await fetch("/api/me", { credentials: "same-origin" }).catch(() => null);
  if (!res || !res.ok) return;
  const user = await res.json();
  if (!user) return;   // 로그인하지 않았으면 /api/me가 null을 돌려준다
  // 관리자 계정에만 사이드바에 관리자 메뉴를 붙인다.
  if (user.is_admin) {
    document.querySelector("#sidebar .side-nav").insertAdjacentHTML("beforeend", '<li><a href="/admin.html"><span>Admin</span></a></li>');
  }
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = user.is_admin ? user.nickname : `[Team ${user.team}] ${user.nickname}`;   // 관리자는 팀 없이 이름(Admin)만
  const out = document.createElement("button");
  out.type = "button";
  out.textContent = "Sign out";
  out.addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
    location.assign("/");
  });
  document.getElementById("signIn").replaceWith(who, out);
})();
</script>
</body>
