<script>
// 하단 바는 첫 화면 바닥에 붙어 있다가, 내려가는 동안에는 사진을 가리지 않게 숨는다.
// 맨 위로 돌아오거나 맨 아래까지 내려가면 다시 나타난다.
(function () {
  const EDGE = 2;         // 스크롤 위치가 소수점으로 떨어지는 브라우저를 위해 약간의 여유
  const TOP_GRACE = 40;   // 아주 살짝 내린 정도로는 숨지 않고 이만큼(px)은 버틴다
  const sync = () => {
    const doc = document.documentElement;
    const atTop = window.scrollY <= TOP_GRACE;
    const atBottom = window.innerHeight + window.scrollY >= doc.scrollHeight - EDGE;
    document.body.classList.toggle("foot-hidden", !(atTop || atBottom));
  };
  window.addEventListener("scroll", sync, { passive: true });
  window.addEventListener("resize", sync);
  sync();
})();

// 로그인했으면 Sign in 자리에 내 이름(마이페이지로)과 로그아웃을 둔다.
(async function () {
  const res = await fetch("/api/me", { credentials: "same-origin" }).catch(() => null);
  if (!res || !res.ok) return;
  const user = await res.json();
  if (!user) return;   // 로그인하지 않았으면 /api/me가 null을 돌려준다
  const who = document.createElement("a");
  who.className = "who";
  who.href = "/mypage.html";
  who.textContent = `[${user.team}] ${user.nickname}`;
  const out = document.createElement("button");
  out.type = "button";
  out.textContent = "Sign out";
  out.addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
    location.reload();
  });
  document.getElementById("signIn").replaceWith(who, out);
})();
</script>
