<!doctype html>
<html lang="ko">
<head>
  <script src="/assets/local-preview.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit — IBA Scoring Machine</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&family=Playfair+Display:wght@700;900&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/chrome.css">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/submit.css">
  <script src="/assets/icons.js" defer></script>
  <script src="/assets/app.js" defer blocking="render"></script>
  <script src="/assets/chrome.js" defer blocking="render"></script>
  <script src="/assets/submit.js" defer></script>
</head>
<body>
<main class="page submit-page">
<div class="submit-divider" aria-hidden="true"></div>
<div class="submit-layout">
<div class="submit-controls">
  <!-- 로그인 전: 상자 없이 안내 한 줄. 오른쪽 위 Sign in 옆에 흔들리는 화살표가 붙는다(submit.css) -->
  <p class="signin-prompt" id="needLogin" hidden><span id="signinPromptText">Please sign in first to submit your model.</span></p>

  <section id="formCard" hidden>
    <form id="form" novalidate>
      <input type="file" name="file" id="file" accept=".csv,text/csv" hidden>
      <button type="button" class="file-box" id="submitBtn">
        <!-- 아이콘: 겹친 종이 두 장(뒤 장은 옅게) -->
        <svg class="file-box-icon" viewBox="0 0 52 56" fill="none" aria-hidden="true">
          <path class="back" d="M18 6h18l10 10v32a2 2 0 0 1-2 2"/>
          <path d="M9 8h18l10 10v32a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2Z"/>
          <path d="M27 8v10h10M14 30h16M14 37h16M14 44h9"/>
        </svg>
        <span class="file-box-name" id="fileBoxName" hidden></span>
        <span id="fileBoxLabel">add file</span>
      </button>
      <button type="button" class="change-file" id="changeFile" hidden>change file</button>
    </form>
  </section>
  <div class="result" id="result" hidden></div>

</div>
<section class="submit-sequence" aria-label="채점 결과">
  <div class="sequence-idle" id="sequenceIdle" aria-hidden="true">
    <p class="sequence-wait" id="sequenceWait">waiting for a file<span class="sequence-caret">_</span></p>
    <p class="sequence-notice" id="sequenceNotice" hidden></p>
  </div>
  <div id="sequenceContent" hidden>
    <div class="sequence-viewport" id="sequenceViewport" aria-hidden="true"><pre id="sequenceText"><span class="sequence-caret" id="typingCaret" hidden>_</span></pre></div>
    <div class="sequence-outcome" id="sequenceOutcome" hidden>
      <p class="sequence-label">Public</p>
      <div class="sequence-result-row">
        <p class="sequence-score" id="sequenceScore"></p>
        <a class="leaderboard-link" href="/leaderboard.html">check the leaderboard!<svg class="leaderboard-arrow" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M1 5h11M8.5 1.5 12 5l-3.5 3.5"/></svg></a>
      </div>
    </div>
  </div>
</section>
</div>
<p class="submit-announcement" id="submitAnnouncement" role="status" aria-live="polite" aria-atomic="true"></p>
</main>

</body>
</html>
